```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonata Toscana</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top left, #d9a66a 0%, transparent 35%),
                linear-gradient(135deg, #3d3025, #6d4b35 45%, #9b6b43);
            color: #f7ead5;
            padding: 40px 20px;
        }

        .page {
            max-width: 1100px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
        }

        .logo {
            font-size: 28px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-style: italic;
            opacity: 0.75;
            margin-top: 6px;
        }

        .date {
            font-size: 14px;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .player {
            background: rgba(54, 39, 29, 0.82);
            border: 1px solid rgba(247, 234, 213, 0.18);
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 25px 70px rgba(35, 22, 14, 0.35);
            backdrop-filter: blur(8px);
        }

        .player-main {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 55px;
            align-items: center;
        }

        .album-art {
            aspect-ratio: 1;
            border-radius: 12px;
            background:
                linear-gradient(rgba(91, 57, 35, 0.15), rgba(91, 57, 35, 0.45)),
                linear-gradient(145deg, #b97948, #7d4c34 55%, #463326);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .album-art::before {
            content: "❦";
            font-size: 95px;
            color: rgba(247, 234, 213, 0.7);
        }

        .album-label {
            position: absolute;
            bottom: 22px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.75;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            margin-bottom: 8px;
        }

            font-size: 18px;

            margin-bottom: 35px;
        }

        .progress {
            width: 100%;
            height: 5px;
            background: rgba(247, 234, 213, 0.2);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #d8a15d;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .times {
            display: flex;
            justify-content: space-between;

            margin-top: 10px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 32px;
        }

        button {
            border: none;
            color: #f7ead5;

            font-size: 20px;

        .play-button {
            width: 64px;

        .song:hover {
            background: rgba(247, 234, 213, 0.12);
            transform: translateX(3px);
        }

            opacity: 0.45;

        .song-name {

        }

        .duration {

        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            opacity: 0.45;
            letter-spacing: 1px;
        }

        @media (max-width: 750px) {
            .player {
                padding: 25px;
            }

            .player-main {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .album-art {
                max-width: 320px;
                width: 100%;
                margin: auto;
            }

            h1 {
                font-size: 36px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <header>
            <div>
                <div class="logo">♫ Sonata Toscana</div>
                <div class="subtitle">musica per le giornate d'autunno</div>
            </div>

            <div class="date">LA TUA PICCOLA RADIO</div>
        </header>

        <main class="player">

            <div class="player-main">

                <div class="album-art">
                    <div class="album-label">Sonata Toscana</div>
                </div>

                <div class="player-info">

                    <div class="eyebrow">Now Playing</div>

                    <h1>Scale Test 7</h1>

                    <div class="artist">Your Artist</div>

                    <div class="progress" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>

                    <div class="times">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>

                    <div class="controls">

                        <button class="small-button" id="prevButton">
                            ◀
                        </button>

                        <button class="play-button" id="playButton">
                            ▶
                        </button>

                        <button class="small-button" id="nextButton">
                            ▶
                        </button>

                    </div>

                    <div class="volume">
                        <span>🔊</span>
                        <input
                            type="range"
                            id="volumeSlider"
                            min="0"
                            max="1"
                            step="0.01"
                            value="0.8"
                        >
                    </div>

                </div>

            </div>

            <div class="section">

                <div class="section-title">La tua musica</div>

                <div class="playlist">

                    <div class="song" id="song1">

                        <div class="song-number">01</div>

                        <div>
                            <div class="song-name">
                                Scale Test 7
                            </div>

                            <div class="song-artist">
                                Your Artist
                            </div>
                        </div>

                        <div class="duration" id="songDuration">
                            0:00
                        </div>

                    </div>

                </div>

            </div>

        </main>

        <footer>
            fatto con amore in Toscana · ♡
        </footer>

    </div>

    <audio id="audioPlayer" preload="metadata">
        <source src="music/Scale%20Test%207.mp3" type="audio/mpeg">
    </audio>

    <script>

        const audio = document.getElementById("audioPlayer");
        const playButton = document.getElementById("playButton");
        const progressBar = document.getElementById("progressBar");
        const progressFill = document.getElementById("progressFill");
        const currentTimeDisplay = document.getElementById("currentTime");
        const durationDisplay = document.getElementById("duration");
        const songDuration = document.getElementById("songDuration");
        const volumeSlider = document.getElementById("volumeSlider");
        const song = document.getElementById("song1");

        function formatTime(seconds) {

            if (isNaN(seconds)) {
                return "0:00";
            }

            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);

            return minutes + ":" +
                remainingSeconds.toString().padStart(2, "0");
        }

        playButton.addEventListener("click", function () {

            if (audio.paused) {

                audio.play();

                playButton.textContent = "❚❚";

            } else {

                audio.pause();

                playButton.textContent = "▶";

            }

        });

        audio.addEventListener("loadedmetadata", function () {

            const formattedDuration = formatTime(audio.duration);

            durationDisplay.textContent = formattedDuration;
            songDuration.textContent = formattedDuration;

        });

        audio.addEventListener("timeupdate", function () {

            if (!audio.duration) {
                return;
            }

            const progress =
                (audio.currentTime / audio.duration) * 100;

            progressFill.style.width = progress + "%";

            currentTimeDisplay.textContent =
                formatTime(audio.currentTime);

        });

        progressBar.addEventListener("click", function (event) {

            const width = progressBar.clientWidth;

            const clickPosition = event.offsetX;

            const percentage = clickPosition / width;

            audio.currentTime = percentage * audio.duration;

        });

        volumeSlider.addEventListener("input", function () {

            audio.volume = volumeSlider.value;

        });

        song.addEventListener("click", function () {

            audio.currentTime = 0;
            audio.play();

            playButton.textContent = "❚❚";

        });

        audio.addEventListener("ended", function () {

            playButton.textContent = "▶";
            progressFill.style.width = "0%";
            currentTimeDisplay.textContent = "0:00";

        });

        audio.volume = 0.8;

    </script>

</body>
</html>
