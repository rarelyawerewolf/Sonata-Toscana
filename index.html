<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonata Toscana</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top left, #d9a66a 0%, transparent 35%),
                linear-gradient(135deg, #3d3025, #6d4b35 45%, #9b6b43);
            color: #f7ead5;
            padding: 40px 20px;
        }

        .page {
            max-width: 1100px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
        }

        .logo {
            font-size: 28px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-family: Georgia, serif;
            font-style: italic;
            opacity: 0.75;
            margin-top: 6px;
        }

        .date {
            font-size: 14px;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .player {
            background: rgba(54, 39, 29, 0.82);
            border: 1px solid rgba(247, 234, 213, 0.18);
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 25px 70px rgba(35, 22, 14, 0.35);
            backdrop-filter: blur(8px);
        }

        .player-main {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 55px;
            align-items: center;
        }

        .album-art {
            aspect-ratio: 1;
            border-radius: 12px;
            background:
                linear-gradient(rgba(91, 57, 35, 0.15), rgba(91, 57, 35, 0.45)),
                linear-gradient(145deg, #b97948, #7d4c34 55%, #463326);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .album-art::before {
            content: "❦";
            font-size: 95px;
            color: rgba(247, 234, 213, 0.7);
        }

        .album-label {
            position: absolute;
            bottom: 22px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.75;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .artist {
            font-size: 18px;
            font-style: italic;
            opacity: 0.72;
            margin-bottom: 35px;
        }

        .progress {
            width: 100%;
            height: 5px;
            background: rgba(247, 234, 213, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            width: 34%;
            height: 100%;
            background: #d8a15d;
            border-radius: 10px;
        }

        .times {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            opacity: 0.55;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 32px;
        }

        button {
            border: none;
            color: #f7ead5;
            background: transparent;
            cursor: pointer;
            font-family: Georgia, serif;
        }

        .small-button {
            font-size: 20px;
            opacity: 0.7;
        }

        .play-button {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #d19a58;
            color: #3d2b20;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .section {
            margin-top: 45px;
        }

        .section-title {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 18px;
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song {
            display: grid;
            grid-template-columns: 45px 1fr auto;
            align-items: center;
            padding: 15px 18px;
            border-radius: 12px;
            background: rgba(247, 234, 213, 0.06);
            transition: 0.2s ease;
        }

        .song:hover {
            background: rgba(247, 234, 213, 0.12);
            transform: translateX(3px);
        }

        .song-number {
            opacity: 0.45;
        }

        .song-name {
            font-size: 16px;
        }

        .song-artist {
            font-size: 13px;
            opacity: 0.55;
            margin-top: 3px;
        }

        .duration {
            font-size: 13px;
            opacity: 0.5;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            opacity: 0.45;
            letter-spacing: 1px;
        }

        @media (max-width: 750px) {
            .player {
                padding: 25px;
            }

            .player-main {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .album-art {
                max-width: 320px;
                width: 100%;
                margin: auto;
            }

            h1 {
                font-size: 36px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <header>
            <div>
                <div class="logo">♫ Sonata Toscana</div>
                <div class="subtitle">musica per le giornate d'autunno</div>
            </div>

            <div class="date">LA TUA PICCOLA RADIO</div>
        </header>

        <main class="player">

            <div class="player-main">

                <div class="album-art">
                    <div class="album-label">Sonata Toscana</div>
                </div>

                <div class="player-info">

                    <div class="eyebrow">Now Playing</div>

                    <h1>Autumn Song</h1>

                    <div class="artist">Your Artist</div>

                    <div class="progress">
                        <div class="progress-fill"></div>
                    </div>

                    <div class="times">
                        <span>1:24</span>
                        <span>4:12</span>
                    </div>

                    <div class="controls">
                        <button class="small-button">↶</button>
                        <button class="small-button">◀</button>
                        <button class="play-button">▶</button>
                        <button class="small-button">▶</button>
                        <button class="small-button">↷</button>
                    </div>

                </div>

            </div>

            <div class="section">

                <div class="section-title">La tua musica</div>

                <div class="playlist">

                    <div class="song">
                        <div class="song-number">01</div>
                        <div>
                            <div class="song-name">Autumn Song</div>
                            <div class="song-artist">Your Artist</div>
                        </div>
                        <div class="duration">4:12</div>
                    </div>

                    <div class="song">
                        <div class="song-number">02</div>
                        <div>
                            <div class="song-name">Golden Afternoon</div>
                            <div class="song-artist">Your Artist</div>
                        </div>
                        <div class="duration">3:48</div>
                    </div>

                    <div class="song">
                        <div class="song-number">03</div>
                        <div>
                            <div class="song-name">Vino e Foglie</div>
                            <div class="song-artist">Your Artist</div>
                        </div>
                        <div class="duration">5:01</div>
                    </div>

                </div>

            </div>

        </main>

        <footer>
            fatto con amore in Toscana · ♡
        </footer>

    </div>

</body>
</html>
